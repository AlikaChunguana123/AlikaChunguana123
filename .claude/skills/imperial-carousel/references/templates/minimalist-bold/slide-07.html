<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Slide 07 — O que muda (Minimalist Bold)</title>
<link rel="stylesheet" href="style.css">
<style>html, body { background: #0A0A0A !important; }</style>
</head>
<body class="body-ink">
<section class="slide ink">

  <div class="top-frame">
    <div class="brand">
      <div class="brand-mark">B</div>
      <div class="brand-text">Bianca Freitas<span class="sub">Mentoria Castle</span></div>
    </div>
    <div class="page-meta">Carrossel &middot; Posicionar<br>07 / 08</div>
  </div>

  <div class="swipe-indicator">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M9 6l6 6-6 6" stroke="#F5F1EA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
  </div>

  <div class="layout-split split-45-55">
    <div class="photo-block" style="background-image:url('photos/foto-cafe.jpg');background-position:center 28%;"></div>

    <div class="split-col">
      <div class="eyebrow-block">Quando a tese está clara</div>

      <h2 class="headline big" style="margin-top:30px;">
        A cliente<br>
        para de<br>
        <span class="accent">pesquisar.</span>
      </h2>

      <p class="body-text">
        <strong>Não abre 3 orçamentos.</strong> Não pede desconto. Não pergunta &ldquo;pode dar um descontinho?&rdquo;. Ela <strong>entra ou não entra</strong> &mdash; e geralmente entra.
      </p>
    </div>
  </div>

  <div class="bottom-frame">
    <div class="meta">O que muda &middot; Comportamento da cliente</div>
    <div class="meta" style="font-family:'JetBrains Mono',monospace;">VII / VIII</div>
  </div>

</section>
</body>
</html>
