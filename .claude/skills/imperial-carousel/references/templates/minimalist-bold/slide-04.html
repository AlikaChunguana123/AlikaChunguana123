<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Slide 04 — Aplicação (Minimalist Bold)</title>
<link rel="stylesheet" href="style.css">
<style>html, body { background: #0A0A0A !important; }</style>
</head>
<body class="body-ink">
<section class="slide ink">

  <div class="top-frame">
    <div class="brand">
      <div class="brand-mark">B</div>
      <div class="brand-text">Bianca Freitas<span class="sub">Mentoria Castle</span></div>
    </div>
    <div class="page-meta">Carrossel &middot; Posicionar<br>04 / 08</div>
  </div>

  <div class="swipe-indicator">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M9 6l6 6-6 6" stroke="#F5F1EA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
  </div>

  <div class="layout-text">
    <div class="eyebrow-block">A diferença que define tudo</div>

    <h2 class="headline giant" style="margin-top:30px;">
      Você é <span class="accent">premium</span><br>
      ou só caro?
    </h2>

    <div class="compare">
      <div class="compare-col">
        <div class="compare-label">Caro</div>
        <p class="compare-text">&ldquo;Cabe<br>parcelar?&rdquo;</p>
      </div>
      <div class="compare-col">
        <div class="compare-label">Premium</div>
        <p class="compare-text">&ldquo;Quando<br>começamos?&rdquo;</p>
      </div>
    </div>
  </div>

  <div class="bottom-frame">
    <div class="meta">Aplicação &middot; A pergunta espelho</div>
    <div class="meta" style="font-family:'JetBrains Mono',monospace;">IV / VIII</div>
  </div>

</section>
</body>
</html>
