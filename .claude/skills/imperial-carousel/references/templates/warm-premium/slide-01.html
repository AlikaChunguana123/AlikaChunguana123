<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Slide 01 — Capa (Warm Premium)</title>
<link rel="stylesheet" href="style.css">
<style>html, body { background: #3D2817 !important; }</style>
</head>
<body class="body-terra">
<section class="slide terra has-photo" style="background-image:url('photos/foto-capa.jpg');">

  <div class="top-frame">
    <div class="brand">
      <div class="brand-mark">B</div>
      <div class="brand-text">Bianca Freitas<span class="sub">Mentoria Castle</span></div>
    </div>
    <div class="page-meta">Carrossel &middot; Posicionar<br>01 / 08</div>
  </div>

  <div class="swipe-indicator">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M9 6l6 6-6 6" stroke="#EFE7D8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
  </div>

  <div class="cover-text">
    <div class="cover-eyebrow-wrap">
      <div class="rule"></div>
      <div class="cover-eyebrow">Pra empresária digital premium</div>
      <div class="rule"></div>
    </div>

    <h1 class="cover-title">
      Você cobra alto<br>
      e ouve <span class="accent">&ldquo;cabe parcelar?&rdquo;</span>
    </h1>

    <div class="cover-highlight">
      <p class="text">Não é o preço. <strong>É quem você atraiu.</strong></p>
    </div>
  </div>

  <div class="bottom-frame">
    <div class="meta">Bloco I &middot; Tese</div>
    <div class="meta" style="font-family:'JetBrains Mono',monospace;">I / VIII</div>
  </div>

</section>
</body>
</html>
