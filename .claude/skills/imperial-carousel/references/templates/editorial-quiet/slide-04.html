<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Slide 04 — Aplicação</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="slide dark">

  <div class="top-frame">
    <div class="logo-circle">
      <div class="logo-mark">B</div>
      <div class="logo-text">Bianca Freitas<span class="sub">Mentoria Castle</span></div>
    </div>
    <div class="meta-right">Carrossel &middot; Posicionar<br>04 &mdash; 08</div>
  </div>

  <div class="swipe-indicator">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M9 6l6 6-6 6" stroke="#1F0D23" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
  </div>

  <div class="layout-text">
    <div class="eyebrow">A diferença que define tudo</div>
    <div class="hairline"></div>

    <h2 class="headline giant" style="font-size:104px;">
      Você é premium<br>
      <span class="accent">ou só caro?</span>
    </h2>

    <div class="compare">
      <div class="compare-col">
        <div class="compare-label">Caro</div>
        <p class="compare-quote">Cliente perguntando<br><strong>&ldquo;cabe parcelar?&rdquo;</strong></p>
      </div>
      <div class="compare-col">
        <div class="compare-label">Premium</div>
        <p class="compare-quote">Cliente perguntando<br><strong>&ldquo;quando começamos?&rdquo;</strong></p>
      </div>
    </div>
  </div>

  <div class="bottom-frame-v2">
    <div class="meta">Aplicação &middot; A pergunta espelho</div>
    <div class="meta">IV &mdash; VIII</div>
  </div>

</section>
</body>
</html>
