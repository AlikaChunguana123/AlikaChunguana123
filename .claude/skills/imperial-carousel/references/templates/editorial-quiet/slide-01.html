<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Slide 01 — Capa</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="slide dark has-photo" style="background-image:url('photos/foto-capa.jpg');">

  <div class="cover-top">
    <div class="logo-circle">
      <div class="logo-mark">B</div>
      <div class="logo-text">Bianca Freitas<span class="sub">Mentoria Castle</span></div>
    </div>
    <div class="page-num-top">01 &mdash; 08</div>
  </div>

  <div class="swipe-indicator">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M9 6l6 6-6 6" stroke="#1F0D23" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
  </div>

  <div class="cover-text">
    <div class="cover-eyebrow-wrap">
      <div class="rule"></div>
      <div class="cover-eyebrow">Pra empresária digital premium</div>
      <div class="rule"></div>
    </div>

    <h1 class="cover-title">
      <span class="line-soft">Você cobra alto e ouve</span>
      <span class="line-loud">&ldquo;cabe parcelar?&rdquo;</span>
    </h1>

    <div class="cover-highlight-box">
      <p class="text">Não é o preço. <span class="acc">É quem você atraiu.</span></p>
    </div>
  </div>

  <div class="cover-bottom">
    <div class="meta">Bloco I &middot; Tese &middot; Carrossel Posicionar</div>
  </div>

</section>
</body>
</html>
