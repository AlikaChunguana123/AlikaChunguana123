<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Print-DM · {{STYLE}}</title>
<link rel="stylesheet" href="styles/{{STYLE}}.css">
<style>html, body { background: {{BG}} !important; }</style>
</head>
<body>
<section class="post print-dm">

  <div class="dm-tag">Depoimento real &middot; DM autorizada</div>

  <div class="dm-frame">
    <div class="dm-from">
      <div class="dm-avatar"></div>
      <div class="dm-from-text">Aluna Castle &middot; 3h atrás</div>
    </div>

    <div class="dm-bubble">
      <p class="dm-text">
        Bianca, em 2 semanas aplicando o método dobrei o ticket. As clientes que eu já tinha aceitaram o reajuste sem pestanejar. E a nova entrou já pagando o valor cheio.
      </p>
    </div>

    <p class="dm-highlight">
      O preço subiu. A objeção sumiu.
    </p>
  </div>

  <div class="brand">
    <div class="brand-mark">B</div>
    <div class="brand-text">Bianca Freitas<span class="sub">Mentoria Castle</span></div>
  </div>

</section>
</body>
</html>
