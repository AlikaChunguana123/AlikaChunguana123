<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Tweet-post · {{STYLE}}</title>
<link rel="stylesheet" href="styles/{{STYLE}}.css">
<style>html, body { background: {{BG}} !important; }</style>
</head>
<body>
<section class="post tweet-post">

  <div class="tweet-card">
    <div class="tweet-header">
      <div class="tweet-avatar">B</div>
      <div>
        <div class="tweet-author">Bianca Freitas</div>
        <div class="tweet-handle">@biancafreitas</div>
      </div>
    </div>

    <p class="tweet-text">
      Você cobra alto e ouve <span class="accent">&ldquo;cabe parcelar?&rdquo;</span>
      <br><br>
      Não é o preço. É quem você atraiu.
    </p>

    <div class="tweet-footer">10:42 &middot; 14 mai 2026 &middot; Carrossel pra ler depois</div>
  </div>

  <div class="brand">
    <div class="brand-mark">B</div>
    <div class="brand-text">Bianca Freitas<span class="sub">Mentoria Castle</span></div>
  </div>

</section>
</body>
</html>
